name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      # Optional release key. Without these secrets the APKs are signed with the runner's
      # debug key, and users must uninstall an older build before installing a new one.
      - name: Signing key
        env:
          ASD_KEYSTORE_BASE64: ${{ secrets.ASD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ASD_KEYSTORE_BASE64" ]; then
            echo "$ASD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ASD_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build release APKs
        env:
          ASD_KEYSTORE_PASSWORD: ${{ secrets.ASD_KEYSTORE_PASSWORD }}
          ASD_KEY_ALIAS: ${{ secrets.ASD_KEY_ALIAS }}
          ASD_KEY_PASSWORD: ${{ secrets.ASD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Collect APKs and checksums
        run: |
          mkdir dist
          for apk in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            cp "$apk" "dist/asd-screening-${GITHUB_REF_NAME}-${abi}.apk"
          done
          (cd dist && sha256sum -- *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Signing certificate
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          "$apksigner" verify dist/*.apk
          cert=$("$apksigner" verify --print-certs dist/*-arm64-v8a.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          echo "CERT_SHA256=$cert" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Which APK?

          | File | Devices |
          | --- | --- |
          | `*-arm64-v8a.apk` | almost every phone sold since 2017 |
          | `*-armeabi-v7a.apk` | older 32-bit phones |
          | `*-x86_64.apk` | emulators on Intel and AMD computers, Chromebooks |

          The APKs contain no stimuli. On first launch the app asks for the `TrainingData/Images` folder of the Saliency4ASD archive ([Zenodo record 2647418](https://zenodo.org/records/2647418)) and checks every picture against its SHA-256.

          Research prototype: it is not a medical device and must not be used to diagnose or rule out autism.
          NOTES
          printf "\nSigning certificate SHA-256: \`%s\`\n" "$CERT_SHA256" >> notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ASD Screening $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
