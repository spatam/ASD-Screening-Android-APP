name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install (CPU build of PyTorch)
        run: |
          # timm imports torchvision, which must come from the same CPU index as torch.
          pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Shell scripts parse
        run: for f in training_scripts/*.sh analysis/*.sh; do bash -n "$f"; done
