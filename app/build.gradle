plugins {
    id 'com.android.application'
}

// Release builds are signed with the key given in these environment variables.
// Without them the release APK falls back to the debug key, which is fine for
// local testing but should not be published.
def releaseKeystore = System.getenv('ASD_KEYSTORE_FILE')

android {
    namespace = 'it.unict.dmi.asdscreening'
    compileSdk = 36

    defaultConfig {
        applicationId = 'it.unict.dmi.asdscreening'
        minSdk = 26
        targetSdk = 36
        versionCode = 2
        versionName = '1.0.1'
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile = file(releaseKeystore)
                storePassword = System.getenv('ASD_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('ASD_KEY_ALIAS')
                keyPassword = System.getenv('ASD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            signingConfig = releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    // One APK per CPU family keeps each download near 65 MB: ONNX Runtime and ML Kit ship
    // large native libraries for each architecture.
    splits {
        abi {
            enable = true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk = false
        }
    }

    packaging {
        // Store native libraries compressed; Android extracts them at install time.
        jniLibs.useLegacyPackaging = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        // Plain JVM tests call into android.util.Log through the classes under test.
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    def camerax = '1.6.2'

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mlkit:face-mesh-detection:16.0.0-beta3'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'

    testImplementation 'junit:junit:4.13.2'
}
