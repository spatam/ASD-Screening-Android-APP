[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asd-gaze"
version = "1.0.0"
description = "Training, evaluation and ONNX export for on-device ASD screening from gaze (Saliency4ASD)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [
    { name = "Massimo Orazio Spata", email = "massimo.spata@unict.it" },
    { name = "Mirko Casu" },
]
keywords = ["autism", "eye tracking", "gaze", "knowledge distillation", "onnx", "saliency4asd"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.2",
    "timm>=1.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Paper = "https://doi.org/10.1109/OJCS.2026.3738736"
Repository = "https://github.com/spatam/ASD-Screening-Android-APP"
Dataset = "https://doi.org/10.5281/zenodo.2647418"

[tool.setuptools]
packages = ["asd_gaze"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["runs", "runs_*", "data"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# The training code keeps the long lines of the paper runs; reformatting them would bury real changes.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The legacy ONNX exporter traces the student and warns about Python booleans in torch internals.
filterwarnings = ["ignore::torch.jit.TracerWarning"]
