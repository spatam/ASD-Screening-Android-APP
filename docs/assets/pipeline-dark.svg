<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="576" viewBox="0 0 1240 576" role="img" aria-label="Training pipeline and on-device inference">
  <rect width="1240" height="576" rx="18" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="1239" height="575" rx="18" fill="none" stroke="#30363d"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="20" y="38" width="1200" height="216" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="42" y="74" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ff8a65">TRAINING · PYTHON · asd_gaze</text>
  <rect x="20" y="334" width="1200" height="216" rx="16" fill="#161b22" stroke="#30363d"/>
  <text x="42" y="370" font-size="14" font-weight="700" letter-spacing="1.5" fill="#ff8a65">ON THE PHONE · ANDROID · OFFLINE</text>
  <rect x="42" y="96" width="262" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="60" y="130" font-size="18" font-weight="700" fill="#f0f6fc">Saliency4ASD</text><text x="60" y="158" font-size="15" fill="#b4bdc8">28 children, 300 pictures</text><text x="60" y="180" font-size="15" fill="#b4bdc8">Tobii T120, 3 s per picture</text><text x="60" y="202" font-size="15" fill="#b4bdc8">14 ASD and 14 TD</text><line x1="308" y1="162.0" x2="329" y2="162.0" stroke="#6e7681" stroke-width="2"/><path d="M327,156.0 L336,162.0 L327,168.0" fill="none" stroke="#6e7681" stroke-width="2"/>
  <rect x="340" y="96" width="262" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="358" y="130" font-size="18" font-weight="700" fill="#f0f6fc">Teacher · Phases 1-2</text><text x="358" y="158" font-size="15" fill="#b4bdc8">frozen ViT-B/16</text><text x="358" y="180" font-size="15" fill="#b4bdc8">+ gaze transformer</text><text x="358" y="202" font-size="15" fill="#b4bdc8">154K trainable parameters</text><line x1="606" y1="162.0" x2="627" y2="162.0" stroke="#6e7681" stroke-width="2"/><path d="M625,156.0 L634,162.0 L625,168.0" fill="none" stroke="#6e7681" stroke-width="2"/>
  <rect x="638" y="96" width="262" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="656" y="130" font-size="18" font-weight="700" fill="#f0f6fc">Student · Phase 3</text><text x="656" y="158" font-size="15" fill="#b4bdc8">MobileNetV3-Small</text><text x="656" y="180" font-size="15" fill="#b4bdc8">KL + BCE distillation</text><text x="656" y="202" font-size="15" fill="#b4bdc8">1.6M parameters</text><line x1="904" y1="162.0" x2="925" y2="162.0" stroke="#6e7681" stroke-width="2"/><path d="M923,156.0 L932,162.0 L923,168.0" fill="none" stroke="#6e7681" stroke-width="2"/>
  <rect x="936" y="96" width="262" height="132" rx="14" fill="#161b22" stroke="#f0643c" stroke-width="2"/>
  <text x="954" y="130" font-size="18" font-weight="700" fill="#f0f6fc">ONNX · Phase 4</text><text x="954" y="158" font-size="15" fill="#b4bdc8">5 folds, opset 18</text><text x="954" y="180" font-size="15" fill="#b4bdc8">6.4 MB per fold</text><text x="954" y="202" font-size="15" fill="#b4bdc8">max error 6e-7 vs PyTorch</text>
  <rect x="42" y="392" width="262" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="60" y="426" font-size="18" font-weight="700" fill="#f0f6fc">Camera to gaze</text><text x="60" y="454" font-size="15" fill="#b4bdc8">CameraX + ML Kit Face Mesh</text><text x="60" y="476" font-size="15" fill="#b4bdc8">pupil centres</text><text x="60" y="498" font-size="15" fill="#b4bdc8">9-point calibration</text><line x1="308" y1="458.0" x2="329" y2="458.0" stroke="#6e7681" stroke-width="2"/><path d="M327,452.0 L336,458.0 L327,464.0" fill="none" stroke="#6e7681" stroke-width="2"/>
  <rect x="340" y="392" width="262" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="358" y="426" font-size="18" font-weight="700" fill="#f0f6fc">Fixations</text><text x="358" y="454" font-size="15" fill="#b4bdc8">I-DT detector</text><text x="358" y="476" font-size="15" fill="#b4bdc8">stimulus pixel coordinates</text><text x="358" y="498" font-size="15" fill="#b4bdc8">one window per picture</text><line x1="606" y1="458.0" x2="627" y2="458.0" stroke="#6e7681" stroke-width="2"/><path d="M625,452.0 L634,458.0 L625,464.0" fill="none" stroke="#6e7681" stroke-width="2"/>
  <rect x="638" y="392" width="262" height="132" rx="14" fill="#161b22" stroke="#f0643c" stroke-width="2"/>
  <text x="656" y="426" font-size="18" font-weight="700" fill="#f0f6fc">5-fold ensemble</text><text x="656" y="454" font-size="15" fill="#b4bdc8">gaze sequence 25 × 3</text><text x="656" y="476" font-size="15" fill="#b4bdc8">picture + heatmap 3 × 224²</text><text x="656" y="498" font-size="15" fill="#b4bdc8">mean of 5 logits</text><line x1="904" y1="458.0" x2="925" y2="458.0" stroke="#6e7681" stroke-width="2"/><path d="M923,452.0 L932,458.0 L923,464.0" fill="none" stroke="#6e7681" stroke-width="2"/>
  <rect x="936" y="392" width="262" height="132" rx="14" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
  <text x="954" y="426" font-size="18" font-weight="700" fill="#f0f6fc">Session score</text><text x="954" y="454" font-size="15" fill="#b4bdc8">sigmoid of the mean logit</text><text x="954" y="476" font-size="15" fill="#b4bdc8">study threshold 0.492</text><text x="954" y="498" font-size="15" fill="#b4bdc8">verdict after 40 pictures</text><path d="M1067.0,232 L1067.0,294.0 L769.0,294.0 L769.0,384" fill="none" stroke="#f0643c" stroke-width="2.2" stroke-dasharray="7 6"/><path d="M762.0,376 L769.0,386 L776.0,376" fill="none" stroke="#f0643c" stroke-width="2.2"/><rect x="826.0" y="277.0" width="184" height="34" rx="17" fill="#2a1712"/><text x="918.0" y="300.0" text-anchor="middle" font-size="15" font-weight="600" fill="#ff8a65">ships in the app</text></g>
</svg>
