      <circle cx="961.9" cy="154.1" r="24.4" fill="#3f8f4f"/>
      <rect x="1032.6" y="150.6" width="45.6" height="59.2" rx="3" fill="#f8fafc"/>
      <polygon points="1028.0,152.4 1055.4,122.8 1082.8,152.4" fill="#dc2626"/>
      <rect x="1048.6" y="178.5" width="13.7" height="31.3" fill="#7c2d12"/>
