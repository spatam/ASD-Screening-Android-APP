    <text x="70" y="160" font-size="66" font-weight="800" fill="#0f172a" letter-spacing="-1.5">ASD Screening</text>
    <text x="72" y="206" font-size="23" fill="#475569">Autism screening from a child's gaze on single pictures,</text>
    <text x="72" y="238" font-size="23" fill="#475569">distilled to run offline on an ordinary Android phone.</text>
    <g font-size="15" font-weight="600" fill="#0f172a">
