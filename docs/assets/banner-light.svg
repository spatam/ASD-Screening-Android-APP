      <path d="M998.4,161.1 L1048.6,148.9 L1062.2,183.7 L1021.2,195.9 L1089.6,157.6" fill="none" stroke="#facc15" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="998.4" cy="161.1" r="4" fill="#22c55e" stroke="#052e16" stroke-width="1.2"/><circle cx="1048.6" cy="148.9" r="4" fill="#22c55e" stroke="#052e16" stroke-width="1.2"/><circle cx="1062.2" cy="183.7" r="4" fill="#22c55e" stroke="#052e16" stroke-width="1.2"/><circle cx="1021.2" cy="195.9" r="4" fill="#22c55e" stroke="#052e16" stroke-width="1.2"/><circle cx="1089.6" cy="157.6" r="5.5" fill="#22c55e" stroke="#052e16" stroke-width="1.2"/>
