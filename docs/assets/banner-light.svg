      <rect x="488" y="270" width="182" height="34" rx="9" fill="#ffffff" stroke="#e5e7eb"/>
      <text x="506" y="292">No network access</text>
    </g>
  </g>

  <ellipse cx="1040.0" cy="175.0" rx="300" ry="170" fill="url(#glow)"/>
  <rect x="868" y="72" width="344" height="206" rx="30" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="882" cy="175.0" r="3.5" fill="#475569"/>
  <rect x="898" y="84" width="292" height="182" rx="8" fill="#111827"/>
  
    <clipPath id="screen"><rect x="930" y="88" width="228" height="174" rx="6"/></clipPath>
    <g clip-path="url(#screen)">
