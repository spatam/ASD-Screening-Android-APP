<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ASD Screening: autism screening from gaze on an Android phone">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8552e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e8552e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff7f3"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="359" rx="18" fill="none" stroke="#e2e8f0"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="58" width="238" height="32" rx="16" fill="#fff0ea"/>
    <circle cx="92" cy="74" r="5" fill="#e8552e"/>
